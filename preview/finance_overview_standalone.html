<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>財務總覽示範（非本人財務）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060b;--surface:rgba(140,150,255,0.045);--border:rgba(255,255,255,0.10);--border-dim:rgba(255,255,255,0.055);--accent:#8b93ff;--accent-dim:rgba(139,147,255,0.10);--text:#eef1fb;--text-2:#b3bdd6;--text-3:#7480a0;--pos:#2ee88a;--neg:#f55d6b;--warn:#f7b731;--mono:"Fira Code","SF Mono",monospace;--ui:Syne,-apple-system,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}body{font-family:var(--ui);background:linear-gradient(160deg,#0a0a12 0%,#050509 55%,#020203 100%) fixed;color:var(--text);min-height:100vh;padding:28px 16px 60px;} .container{max-width:1000px;margin:0 auto;} .preview-note{margin-bottom:14px;color:var(--text-2);font-size:14px;line-height:1.6;}
.fin-root { color: var(--text, #eef1fb); }
.fin-sticky {
  position: sticky;
  top: 8px;
  z-index: 4;
  margin: 0 0 8px;
  padding: 8px 12px;
  text-align: center;
  background: #14110a;
  border: 1px solid rgba(247,183,49,0.45);
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
}
.fin-banner {
  background: #14110a;
  border: 1px solid rgba(247,183,49,0.45);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 12px;
}
.fin-item, .fin-card { scroll-margin-top: 56px; }
.fin-kicker {
  font-family: var(--mono, monospace);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--warn, #f7b731);
  margin-bottom: 4px;
}
.fin-banner p:last-child { color: var(--text-2, #b3bdd6); font-size: 14px; line-height: 1.6; }
.fin-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  margin-bottom: 14px;
  font-family: var(--mono, monospace);
  font-size: 12px;
  color: var(--text-3, #7480a0);
}
.fin-meta b { color: var(--text, #eef1fb); font-weight: 600; }
.fin-kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.fin-kpi, .fin-card, .fin-flows {
  background: var(--surface, rgba(140,150,255,0.045));
  border: 1px solid var(--border-dim, rgba(255,255,255,0.055));
  border-radius: 16px;
}
.fin-kpi { padding: 14px 12px; min-width: 0; }
.fin-kpi-label {
  font-size: 12px;
  color: var(--text-3, #7480a0);
  letter-spacing: 0.04em;
  margin-bottom: 8px;
}
.fin-kpi-value {
  font-family: var(--mono, monospace);
  font-size: 20px;
  font-weight: 700;
  line-height: 1.25;
  overflow-wrap: anywhere;
}
.fin-kpi-value span { font-size: 11px; color: var(--text-3, #7480a0); font-weight: 500; }
.fin-kpi-debt .fin-kpi-value { color: var(--neg, #f55d6b); }
.fin-kpi-net .fin-kpi-value { color: var(--pos, #2ee88a); }
.fin-kpi-sub { margin-top: 6px; font-size: 12px; color: var(--text-3, #7480a0); line-height: 1.45; }
.fin-flows {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 18px;
  padding: 14px;
  margin-bottom: 12px;
}
.fin-flow-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.fin-flow-head span { color: var(--text-2, #b3bdd6); font-size: 13px; }
.fin-flow-head b { font-family: var(--mono, monospace); font-size: 16px; }
.fin-track {
  display: block;
  height: 8px;
  margin-top: 8px;
  border-radius: 99px;
  background: rgba(255,255,255,0.06);
  overflow: hidden;
}
.fin-track span { display: block; height: 100%; background: var(--accent, #8b93ff); border-radius: 99px; }
.fin-flows .fin-hint, .fin-card .fin-hint, .fin-tools .fin-hint { grid-column: 1 / -1; }
.fin-hint { margin-top: 8px; color: var(--text-3, #7480a0); font-size: 12px; line-height: 1.55; }
.fin-card { padding: 14px; margin-bottom: 12px; }
.fin-card h2, .fin-math h3, .fin-native h3 {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 10px;
}
.fin-count {
  font-family: var(--mono, monospace);
  font-size: 12px;
  color: var(--text-3, #7480a0);
  font-weight: 500;
}
.fin-bar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,0.04); }
.fin-seg { display: block; height: 100%; min-width: 2px; }
.fin-seg-bank, .fin-dot.fin-seg-bank { background: #8b93ff; }
.fin-seg-investment, .fin-dot.fin-seg-investment { background: #38c9c9; }
.fin-seg-policy, .fin-dot.fin-seg-policy { background: #f7b731; }
.fin-seg-property, .fin-dot.fin-seg-property { background: #2ee88a; }
.fin-seg-loan-mortgage, .fin-dot.fin-seg-loan-mortgage { background: #f55d6b; }
.fin-seg-loan-credit, .fin-dot.fin-seg-loan-credit { background: #ffb020; }
.fin-seg-loan-usd, .fin-dot.fin-seg-loan-usd { background: #c46bff; }
.fin-math-row small { display: block; margin-top: 2px; color: var(--text-3, #7480a0); font-family: var(--mono, monospace); font-size: 11px; font-weight: 400; }
.fin-legend { list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.fin-legend li { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; }
.fin-legend span { flex: 1; min-width: 0; }
.fin-legend b { font-family: var(--mono, monospace); font-size: 12px; }
.fin-legend em { font-style: normal; font-family: var(--mono, monospace); color: var(--text-3, #7480a0); font-size: 12px; }
.fin-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.fin-tools { margin: 4px 0 12px; }
.fin-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fin-chip, .fin-mask-btn, .fin-sort-label select {
  font-family: var(--ui, sans-serif);
  font-size: 13px;
  border-radius: 999px;
  border: 1px solid var(--border, rgba(255,255,255,0.1));
  background: transparent;
  color: var(--text-2, #b3bdd6);
  padding: 8px 12px;
  cursor: pointer;
}
.fin-chip[aria-pressed="true"], .fin-mask-btn[aria-pressed="true"] {
  background: var(--accent-dim, rgba(139,147,255,0.1));
  border-color: var(--accent, #8b93ff);
  color: var(--accent, #8b93ff);
}
.fin-sort-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 10px 10px 0 0;
  color: var(--text-3, #7480a0);
  font-size: 13px;
}
.fin-sort-label select { color-scheme: dark; border-radius: 8px; background: #12141c; color: var(--text, #eef1fb); }
.fin-mask-btn { margin-top: 10px; }
.fin-item {
  border: 1px solid var(--border-dim, rgba(255,255,255,0.055));
  border-left-width: 3px;
  border-radius: 12px;
  margin-bottom: 8px;
  background: rgba(255,255,255,0.02);
}
.fin-item[data-cat="bank"] { border-left-color: #8b93ff; }
.fin-item[data-cat="investment"] { border-left-color: #38c9c9; }
.fin-item[data-cat="policy"] { border-left-color: #f7b731; }
.fin-item[data-cat="property"] { border-left-color: #2ee88a; }
.fin-item[data-cat="loan"] { border-left-color: #f55d6b; }
.fin-row {
  width: 100%;
  display: grid;
  grid-template-columns: auto 1fr auto;
  grid-template-areas: "cat name amt" "meta meta more";
  gap: 4px 10px;
  text-align: left;
  background: transparent;
  border: 0;
  color: inherit;
  font-family: inherit;
  padding: 12px;
  cursor: pointer;
}
.fin-cat { grid-area: cat; font-size: 11px; color: var(--accent, #8b93ff); letter-spacing: 0.04em; }
.fin-name { grid-area: name; font-weight: 700; }
.fin-line-amt { grid-area: amt; font-family: var(--mono, monospace); font-weight: 700; white-space: nowrap; }
.fin-line-meta { grid-area: meta; color: var(--text-2, #b3bdd6); font-size: 13px; line-height: 1.5; }
.fin-more { grid-area: more; justify-self: end; color: var(--text-3, #7480a0); font-size: 12px; }
.fin-detail { padding: 0 12px 12px; }
.fin-detail dl { display: grid; grid-template-columns: 148px 1fr; gap: 6px 12px; }
.fin-detail dl > div:not(.fin-note) { display: contents; }
.fin-detail dt { color: var(--text-3, #7480a0); font-size: 12px; }
.fin-detail dd { font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
.fin-detail .fin-out { color: var(--text-3, #7480a0); }
.fin-detail .fin-note { grid-column: 1 / -1; padding-top: 4px; }
.fin-badge {
  display: inline-block;
  margin-right: 6px;
  padding: 0 6px;
  border: 1px solid rgba(247,183,49,0.5);
  border-radius: 99px;
  color: var(--warn, #f7b731);
  font-size: 10px;
  vertical-align: 1px;
}
.fin-subtotal, .fin-empty { color: var(--text-2, #b3bdd6); font-size: 13px; }
.fin-subtotal { text-align: right; font-family: var(--mono, monospace); }
.fin-scroll { overflow-x: auto; }
.fin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.fin-table th, .fin-table td { padding: 8px 8px; border-bottom: 1px solid var(--border-dim, rgba(255,255,255,0.055)); text-align: left; vertical-align: top; }
.fin-table th { color: var(--text-3, #7480a0); font-size: 12px; font-weight: 600; }
.fin-num { font-family: var(--mono, monospace); white-space: nowrap; text-align: right; }
.fin-native { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fin-native ul { list-style: none; }
.fin-native li { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--border-dim, rgba(255,255,255,0.055)); font-size: 13px; }
.fin-native b { font-family: var(--mono, monospace); }
.fin-math { margin-bottom: 14px; }
.fin-math-row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 13px; }
.fin-math-row b { font-family: var(--mono, monospace); white-space: nowrap; }
.fin-math-row.is-total { border-top: 1px solid var(--border, rgba(255,255,255,0.1)); font-weight: 700; margin-top: 4px; padding-top: 8px; }
.fin-rules { margin-left: 18px; color: var(--text-2, #b3bdd6); font-size: 14px; }
.fin-rules li { margin: 6px 0; line-height: 1.55; }
.fin-future p { color: var(--text-2, #b3bdd6); font-size: 14px; line-height: 1.65; margin-bottom: 8px; }
.fin-fallback { color: var(--warn, #f7b731); padding: 16px; line-height: 1.6; }
.fin-chip:focus-visible, .fin-mask-btn:focus-visible, .fin-row:focus-visible, .fin-sort-label select:focus-visible {
  outline: 2px solid var(--accent, #8b93ff);
  outline-offset: 2px;
}
@media (max-width: 800px) {
  .fin-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fin-flows, .fin-native, .fin-legend { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .fin-kpi-value { font-size: 16px; }
  .fin-row { grid-template-columns: 1fr auto; grid-template-areas: "cat amt" "name amt" "meta meta" "more more"; }
  .fin-detail dl { grid-template-columns: 1fr; }
  .fin-sort-label, .fin-sort-label select, .fin-mask-btn, .fin-chip { font-size: 16px; }
  .fin-scroll { overflow: visible; }
  .fin-table thead { display: none; }
  .fin-table, .fin-table tbody, .fin-table tr, .fin-table td { display: block; width: auto; }
  .fin-table tr { padding: 8px 0; border-bottom: 1px solid var(--border-dim, rgba(255,255,255,0.055)); }
  .fin-table td { border: 0; padding: 2px 0; text-align: left; white-space: normal; }
  .fin-table td::before { content: attr(data-label); display: block; color: var(--text-3, #7480a0); font-size: 11px; }
  .fin-num { text-align: left; }
}

</style>
</head>
<body>
<div class="container">

<div id="tab-finance"></div>
</div>
<script>
/* 財務總覽示範資料與整數試算。
   公開頁面只使用這份虛構數字。不讀取其他檔案，不寫入瀏覽器儲存，不對外送出。
   私人財務資料層尚未實作。 */
(function (root) {
  'use strict';

  const DEMO = {

    label: '示範資料，非本人財務',

    },
    banks: [
      {
        id: 'bank-twd-demand',

      {

        institution: '虛構南區示範銀行',
        product: '臺幣定期存款',
        kind: 'fixed',
        amount: { currency: 'TWD', minor: 500000, scale: 1 },
        annualRateBp: 160,
        maturity: '2027-05-01',
        asOf: '2026-11-01',
      },
      {
        id: 'bank-jpy-fixed',
        institution: '虛構南區示範銀行',
        product: '日圓定期存款',
        kind: 'fixed',
        amount: { currency: 'JPY', minor: 1000000, scale: 1 },
        annualRateBp: 40,
        maturity: '2027-02-01',
        asOf: '2026-11-01',
      },
    ],
    investments: [
      {
        id: 'inv-demo1',
        name: '虛構普通股甲',
        symbol: 'DEMO1',
        instrument: '股票',
        quantity: { minor: 2000, scale: 1, unit: '股' },
        price: { currency: 'TWD', minor: 8550, scale: 100 },
        market: { currency: 'TWD', minor: 171000, scale: 1 },
        asOf: '2026-11-01',
      },
      {
        id: 'inv-demo2',
        name: '虛構普通股乙',
        symbol: 'DEMO2',
        instrument: '股票',
        quantity: { minor: 100, scale: 1, unit: '股' },
        price: { currency: 'USD', minor: 4200, scale: 100 },
        market: { currency: 'USD', minor: 420000, scale: 100 },
        asOf: '2026-11-01',
      },
      {
        id: 'inv-demof',
        name: '虛構全球平衡基金',
        symbol: 'DEMOF',
        instrument: '基金',
        quantity: { minor: 1200, scale: 1, unit: '單位' },
        price: { currency: 'TWD', minor: 2000, scale: 100 },
        market: { currency: 'TWD', minor: 24000, scale: 1 },
        asOf: '2026-11-01',
      },
    ],
    policies: [
      {
        id: 'pol-trad',
        insurer: '虛構人壽',
        name: '虛構傳統終身壽險甲',
        policyNo: 'DEMO-POL-001',
        type: 'traditional',
        counted: 'surrender',
        surrender: { currency: 'TWD', minor: 128000, scale: 1 },
        account: null,
        deathBenefit: { currency: 'TWD', minor: 2000000, scale: 1 },
        premiumsPaid: { currency: 'TWD', minor: 360000, scale: 1 },
        monthlyPremium: { currency: 'TWD', minor: 3000, scale: 1 },
        asOf: '2026-10-31',
      },
      {
        id: 'pol-ilp',
        insurer: '虛構人壽',
        name: '虛構投資型保單乙',
        policyNo: 'DEMO-POL-002',
        type: 'investment',
        counted: 'account',
        surrender: { currency: 'TWD', minor: 390000, scale: 1 },
        account: { currency: 'TWD', minor: 412500, scale: 1 },
        deathBenefit: { currency: 'TWD', minor: 1500000, scale: 1 },
        premiumsPaid: { currency: 'TWD', minor: 480000, scale: 1 },
        monthlyPremium: { currency: 'TWD', minor: 5000, scale: 1 },
        asOf: '2026-10-31',
      },
    ],
    properties: [
      {
        id: 'prop-home',
        name: '虛構住宅',
        place: '虛構縣市示範路 1 號',
        valuation: { currency: 'TWD', minor: 8500000, scale: 1 },
        asOf: '2026-09-30',
        linkedLoanId: 'loan-mortgage',
      },
    ],
    loans: [
      {
        id: 'loan-mortgage',
        name: '虛構房貸',
        lender: '虛構南區示範銀行',
        principal: { currency: 'TWD', minor: 3200000, scale: 1 },
        annualRateBp: 215,
        monthly: { currency: 'TWD', minor: 18600, scale: 1 },
        maturity: '2046-11-01',
        balloon: { currency: 'TWD', minor: 0, scale: 1 },
        asOf: '2026-11-01',
        linkedPropertyId: 'prop-home',
      },
      {
        id: 'loan-credit',
        name: '虛構信用貸款',
        lender: '虛構北區示範銀行',
        principal: { currency: 'TWD', minor: 240000, scale: 1 },
        annualRateBp: 380,
        monthly: { currency: 'TWD', minor: 4200, scale: 1 },
        maturity: '2029-06-01',
        balloon: { currency: 'TWD', minor: 80000, scale: 1 },
        asOf: '2026-11-01',
      },
      {
        id: 'loan-usd',
        name: '虛構外幣貸款',
        lender: '虛構海外示範銀行',
        principal: { currency: 'USD', minor: 100000, scale: 100 },
        annualRateBp: 500,
        monthly: { currency: 'USD', minor: 5000, scale: 100 },
        maturity: '2028-01-15',
        balloon: { currency: 'USD', minor: 20000, scale: 100 },
        asOf: '2026-11-01',
      },
    ],
  };

  const FILTERS = [
    { id: 'all', label: '全部' },
    { id: 'bank', label: '銀行存款' },
    { id: 'investment', label: '投資' },
    { id: 'policy', label: '保單' },
    { id: 'property', label: '不動產' },
    { id: 'loan', label: '貸款' },
  ];

  const SORTS = [
    { id: 'report', label: '報表順序' },
    { id: 'amount-desc', label: '金額高到低' },
    { id: 'amount-asc', label: '金額低到高' },
    { id: 'name', label: '名稱' },
    { id: 'date', label: '資料日期新到舊' },
  ];

  const CATEGORY_LABEL = {
    bank: '銀行存款',
    investment: '投資',
    policy: '保單',
    property: '不動產',
    loan: '貸款',
  };

  function assertInt(n, label) {
    if (!Number.isSafeInteger(n)) throw new Error(label + ' 不是安全整數');
  }

  function formatTwd(n) {
    assertInt(n, '新臺幣');
    const sign = n < 0 ? '-' : '';
    return sign + new Intl.NumberFormat('zh-TW').format(Math.abs(n));
  }

  function formatMinor(minor, scale) {
    assertInt(minor, '金額');
    assertInt(scale, '小數比例');
    if (scale < 1) throw new Error('小數比例無效');
    const digits = String(scale).length - 1;
    if (10 ** digits !== scale) throw new Error('小數比例必須是 10 的次方');
    const sign = minor < 0 ? '-' : '';
    const abs = Math.abs(minor);
    const whole = Math.floor(abs / scale);
    const frac = abs % scale;
    const wholeStr = new Intl.NumberFormat('zh-TW').format(whole);
    if (scale === 1) return sign + wholeStr;
    return sign + wholeStr + '.' + String(frac).padStart(digits, '0');
  }

  function formatMoney(money) {
    return formatMinor(money.minor, money.scale) + ' ' + money.currency;
  }

  function formatFx(entry) {
    const scale = 10 ** entry.digits;
    const scaled = entry.num * scale;
    if (scaled % entry.den !== 0) throw new Error('示範匯率無法以指定小數表示');
    const v = scaled / entry.den;
    const whole = Math.floor(v / scale);
    const frac = String(v % scale).padStart(entry.digits, '0');
    return whole + '.' + frac;
  }

  function formatRate(bp) {
    if (!Number.isInteger(bp) || bp < 0) throw new Error('年利率無效');
    return Math.floor(bp / 100) + '.' + String(bp % 100).padStart(2, '0') + '%';
  }

  function toTwd(money, fx) {
    const rate = fx[money.currency];
    if (!rate) throw new Error('未知幣別 ' + money.currency);
    if (money.currency !== 'TWD' && money.scale !== 1 && money.scale !== 100 && money.scale !== 1000) {
      throw new Error('不支援的小數比例');
    }
    const num = money.minor * rate.num;
    const den = money.scale * rate.den;
    if (den === 0 || num % den !== 0) {
      throw new Error('換算新臺幣無法整除：' + money.currency);
    }
    const twd = num / den;
    assertInt(twd, '換算結果');
    return twd;
  }

  function assertQtyPrice(qty, price, market) {
    if (price.currency !== market.currency) throw new Error('價格與市值幣別不同');
    const left = qty.minor * price.minor * market.scale;
    const right = market.minor * qty.scale * price.scale;
    if (left !== right) throw new Error('數量乘以價格不等於市值');
  }

  function sameMoneyShape(a, b, label) {
    if (!a || !b) throw new Error(label + ' 缺少金額');
    if (a.currency !== b.currency || a.scale !== b.scale) {
      throw new Error(label + ' 的幣別或小數不一致');
    }
  }

  function pushNative(bucket, money) {
    const found = bucket.find(row => row.currency === money.currency);
    if (!found) {
      bucket.push({ currency: money.currency, minor: money.minor, scale: money.scale });
      return;
    }
    if (found.scale !== money.scale) throw new Error(money.currency + ' 的小數比例不一致，不能把原幣相加');
    found.minor += money.minor;
    assertInt(found.minor, money.currency);
  }

  function pctWidth(part, total) {
    if (total === 0) return '0.0000%';
    const v = Math.round(part * 1000000 / total);
    return Math.floor(v / 10000) + '.' + String(v % 10000).padStart(4, '0') + '%';
  }

  function pctLabel(part, total) {
    if (total === 0) return '0.0%';
    const v = Math.round(part * 1000 / total);
    return Math.floor(v / 10) + '.' + String(v % 10) + '%';
  }

  function sumTwd(lines) {
    return lines.reduce((acc, line) => acc + line.twd, 0);
  }

  function detail(k, v, kind) {
    return { k: k, v: v, kind: kind || 'in' };
  }

  function fxLine(money, twd, fx) {
    const rate = formatFx(fx[money.currency]);
    const native = formatMinor(money.minor, money.scale);
    if (money.currency === 'TWD') return native + ' TWD × ' + rate;
    return native + ' ' + money.currency + ' × ' + rate + ' = ' + formatTwd(twd) + ' TWD';
  }

  function computeFinance(demo) {
    const fx = demo.fx;
    const lines = [];
    const native = { bank: [], investment: [], policy: [], property: [], loan: [] };
    const excluded = {
      deathBenefitTwd: 0,
      premiumsPaidTwd: 0,
      policyAlternateTwd: 0,
      balloonTwd: 0,
      items: [],
    };
    let order = 0;

    demo.banks.forEach(row => {
      const twd = toTwd(row.amount, fx);
      const liquid = row.kind === 'demand';
      if (row.kind !== 'demand' && row.kind !== 'fixed') throw new Error('未知存款種類');
      pushNative(native.bank, row.amount);
      const kindLabel = row.kind === 'demand' ? '活期存款' : '定期存款';
      const bits = [kindLabel, '原幣 ' + formatMoney(row.amount), '資料日期 ' + row.asOf];
      if (row.annualRateBp != null) bits.splice(1, 0, '年利率 ' + formatRate(row.annualRateBp));
      if (row.maturity) bits.splice(row.annualRateBp != null ? 2 : 1, 0, '到期 ' + row.maturity);
      bits.push(liquid ? '計入流動現金' : '不算流動現金');
      if (row.amount.currency !== 'TWD') bits.push(fxLine(row.amount, twd, fx));
      const details = [
        detail('分類', '銀行存款'),
        detail('機構', row.institution),
        detail('種類', kindLabel),
        detail('幣別', fx[row.amount.currency].name + '（' + row.amount.currency + '）'),
        detail('原幣金額', formatMoney(row.amount)),
        detail('示範匯率', '1 ' + row.amount.currency + ' = ' + formatFx(fx[row.amount.currency]) + ' TWD'),
        detail('換算新臺幣', fxLine(row.amount, twd, fx)),
        detail('資料日期', row.asOf),
        detail('流動可用現金', liquid ? '是。活期存款計入。' : '否。定期存款仍計入總資產，但不算隨時可用的現金。'),
      ];
      if (row.annualRateBp != null) details.push(detail('年利率', formatRate(row.annualRateBp)));
      if (row.maturity) details.push(detail('到期日', row.maturity));
      details.push(detail('說明', '這筆只先換成新臺幣。不同幣別的原幣數字沒有直接相加。', 'note'));
      lines.push({
        id: row.id,
        order: order++,
        side: 'asset',
        category: 'bank',
        depositKind: row.kind,
        liquid: liquid,
        name: row.institution + '・' + row.product,
        meta: bits.join(' · '),
        twd: twd,
        asOf: row.asOf,
        fxText: fxLine(row.amount, twd, fx),
        details: details,
      });
    });

    demo.investments.forEach(row => {
      assertQtyPrice(row.quantity, row.price, row.market);
      const twd = toTwd(row.market, fx);
      pushNative(native.investment, row.market);
      const qtyText = formatMinor(row.quantity.minor, row.quantity.scale) + ' ' + row.quantity.unit;
      const priceText = formatMoney(row.price);
      lines.push({
        id: row.id,
        order: order++,
        side: 'asset',
        category: 'investment',
        liquid: false,
        name: row.name + '（' + row.symbol + '）',
        meta: row.instrument + ' · ' + qtyText + ' × ' + priceText + ' · 資料日期 ' + row.asOf
          + (row.market.currency === 'TWD' ? '' : ' · ' + fxLine(row.market, twd, fx)),
        twd: twd,
        asOf: row.asOf,
        fxText: fxLine(row.market, twd, fx),
        details: [
          detail('分類', '投資'),
          detail('種類', row.instrument),
          detail('代號', row.symbol + '（虛構代號）'),
          detail('數量', qtyText),
          detail('價格', priceText),
          detail('市值檢算', qtyText + ' × ' + priceText + ' = ' + formatMoney(row.market)),
          detail('示範匯率', '1 ' + row.market.currency + ' = ' + formatFx(fx[row.market.currency]) + ' TWD'),
          detail('換算新臺幣', fxLine(row.market, twd, fx)),
          detail('資料日期', row.asOf),
          detail('說明', '資產用目前市值。這份示範沒有成本，也不把市值算進流動現金。', 'note'),
        ],
      });
    });

    demo.policies.forEach(row => {
      let countedMoney;
      let countedLabel;
      let alternate;
      let alternateLabel;
      if (row.type === 'traditional') {
        if (row.counted !== 'surrender' || !row.surrender) throw new Error('傳統保單只計解約金');
        countedMoney = row.surrender;
        countedLabel = '解約金';
        alternate = row.account;
        alternateLabel = '保單帳戶價值';
      } else if (row.type === 'investment') {
        if (row.counted !== 'account' || !row.account) throw new Error('投資型保單只計帳戶價值');
        countedMoney = row.account;
        countedLabel = '保單帳戶價值';
        alternate = row.surrender;
        alternateLabel = '解約金';
      } else {
        throw new Error('未知保單類型');
      }
      const twd = toTwd(countedMoney, fx);
      const monthlyTwd = toTwd(row.monthlyPremium, fx);
      const deathTwd = toTwd(row.deathBenefit, fx);
      const paidTwd = toTwd(row.premiumsPaid, fx);
      pushNative(native.policy, countedMoney);
      excluded.deathBenefitTwd += deathTwd;
      excluded.premiumsPaidTwd += paidTwd;
      excluded.items.push({ label: row.name + '・身故保額', twd: deathTwd, reason: '身故保額不是目前持有的資產。' });
      excluded.items.push({ label: row.name + '・累計已繳保費', twd: paidTwd, reason: '已繳保費不是目前資產。' });
      const details = [
        detail('分類', '保單'),
        detail('保險公司', row.insurer),
        detail('保單號碼', row.policyNo + '（虛構）'),
        detail('類型', row.type === 'traditional' ? '傳統保單' : '投資型保單'),
        detail('計入資產', countedLabel + ' ' + formatMoney(countedMoney)),
        detail('不計入・身故保額', formatMoney(row.deathBenefit), 'out'),
        detail('不計入・累計已繳保費', formatMoney(row.premiumsPaid), 'out'),
      ];
      if (alternate) {
        const alternateTwd = toTwd(alternate, fx);
        excluded.policyAlternateTwd += alternateTwd;
        excluded.items.push({
          label: row.name + '・' + alternateLabel,
          twd: alternateTwd,
          reason: '同一張保單只留一種現值，另一種不重複計入。',
        });
        details.push(detail('不計入・' + alternateLabel, formatMoney(alternate) + '。已採用' + countedLabel + '，兩種現值不重複計算。', 'out'));
      }
      details.push(detail('每月保費', formatMoney(row.monthlyPremium) + '。列入每月保險保費，不列入債務本金。'));
      details.push(detail('資料日期', row.asOf));
      lines.push({
        id: row.id,
        order: order++,
        side: 'asset',
        category: 'policy',
        liquid: false,
        name: row.name,
        meta: (row.type === 'traditional' ? '傳統保單' : '投資型保單')
          + ' · 計入' + countedLabel
          + ' · 資料日期 ' + row.asOf
          + (row.type === 'investment' ? ' · 身故保額與解約金不計入' : ' · 身故保額不計入'),
        twd: twd,
        asOf: row.asOf,
        fxText: fxLine(countedMoney, twd, fx),
        countedLabel: countedLabel,
        monthlyTwd: monthlyTwd,
        monthlyFx: fxLine(row.monthlyPremium, monthlyTwd, fx),
        details: details,
      });
    });

    demo.properties.forEach(row => {
      const twd = toTwd(row.valuation, fx);
      pushNative(native.property, row.valuation);
      lines.push({
        id: row.id,
        order: order++,
        side: 'asset',
        category: 'property',
        liquid: false,
        name: row.name,
        meta: '估價 · ' + row.place + ' · 估價日 ' + row.asOf + ' · 房貸本金另列負債',
        twd: twd,
        asOf: row.asOf,
        fxText: fxLine(row.valuation, twd, fx),
        details: [
          detail('分類', '不動產'),
          detail('名稱', row.name),
          detail('地點', row.place + '（虛構地址）'),
          detail('估價', formatMoney(row.valuation)),
          detail('估價日', row.asOf),
          detail('換算新臺幣', fxLine(row.valuation, twd, fx)),
          detail('說明', '資產用估價毛額。對應房貸的剩餘本金另列在負債，不從這筆估價扣除。', 'note'),
        ],
      });
    });

    demo.loans.forEach(row => {
      sameMoneyShape(row.principal, row.balloon, row.name);
      if (row.balloon.minor < 0 || row.principal.minor < 0) throw new Error('本金不可為負');
      if (row.balloon.minor > row.principal.minor) throw new Error('到期尾款大於剩餘本金');
      const twd = toTwd(row.principal, fx);
      const balloonTwd = toTwd(row.balloon, fx);
      const monthlyTwd = toTwd(row.monthly, fx);
      if (balloonTwd > twd) throw new Error('尾款換算後大於本金');
      pushNative(native.loan, row.principal);
      excluded.balloonTwd += balloonTwd;
      if (row.balloon.minor > 0) {
        excluded.items.push({
          label: row.name + '・到期尾款',
          twd: balloonTwd,
          reason: '尾款已包含在剩餘本金，不另外加進債務。',
        });
      }
      const balloonText = row.balloon.minor === 0
        ? '到期尾款無'
        : '到期尾款 ' + formatMoney(row.balloon) + '（已含在本金）';
      const principalFx = row.principal.currency === 'TWD' ? '' : ' · 本金 ' + fxLine(row.principal, twd, fx);
      lines.push({
        id: row.id,
        order: order++,
        side: 'liability',
        category: 'loan',
        liquid: false,
        name: row.name,
        meta: '年利率 ' + formatRate(row.annualRateBp) + ' · 每月還款 ' + formatMoney(row.monthly) + ' · 到期 ' + row.maturity + ' · ' + balloonText + principalFx,
        twd: twd,
        asOf: row.asOf,
        fxText: fxLine(row.principal, twd, fx),
        balloonTwd: balloonTwd,
        monthlyTwd: monthlyTwd,
        monthlyFx: fxLine(row.monthly, monthlyTwd, fx),
        details: [
          detail('分類', '貸款'),
          detail('名稱', row.name),
          detail('機構', row.lender),
          detail('剩餘本金', formatMoney(row.principal) + '，換算 ' + formatTwd(twd) + ' TWD。負債只計這一個數字。'),
          detail('年利率', formatRate(row.annualRateBp)),
          detail('每月還款', formatMoney(row.monthly) + '，換算 ' + formatTwd(monthlyTwd) + ' TWD。這是還款，不加入本金。'),
          detail('到期日', row.maturity),
          detail('到期尾款', row.balloon.minor === 0 ? '無' : formatMoney(row.balloon) + '，換算 ' + formatTwd(balloonTwd) + ' TWD。'),
          detail('尾款處理', row.balloon.minor === 0 ? '沒有尾款。負債只計剩餘本金。' : '這筆尾款已經包含在剩餘本金裡，債務合計不會再加一次。', 'note'),
          detail('資料日期', row.asOf),
          row.linkedPropertyId
            ? detail('對應資產', '虛構住宅的估價另列在資產，沒有先扣掉這筆房貸。', 'note')
            : detail('說明', '這是無擔保的示範貸款，本金與尾款的算法同上。', 'note'),
        ],
      });
    });

    const assets = lines.filter(line => line.side === 'asset');
    const loans = lines.filter(line => line.category === 'loan');
    const byCategory = {};
    Object.keys(CATEGORY_LABEL).forEach(key => {
      byCategory[key] = sumTwd(lines.filter(line => line.category === key));
    });
    const totals = {
      assetsTwd: sumTwd(assets),
      debtPrincipalTwd: byCategory.loan,
      netWorthTwd: 0,
      liquidCashTwd: sumTwd(lines.filter(line => line.liquid)),
      monthlyDebtTwd: loans.reduce((acc, line) => acc + line.monthlyTwd, 0),
      monthlyPremiumTwd: lines.filter(line => line.category === 'policy').reduce((acc, line) => acc + line.monthlyTwd, 0),
      byCategory: byCategory,
    };
    totals.netWorthTwd = totals.assetsTwd - totals.debtPrincipalTwd;
    Object.keys(totals).forEach(key => {
      if (key !== 'byCategory') assertInt(totals[key], key);
    });
    Object.keys(excluded).forEach(key => {
      if (key !== 'items') assertInt(excluded[key], key);
    });

    const assetOrder = ['bank', 'investment', 'policy', 'property'];
    const allocation = assetOrder.map(key => ({
      category: key,
      label: CATEGORY_LABEL[key],
      twd: byCategory[key],
      pctLabel: pctLabel(byCategory[key], totals.assetsTwd),
      width: pctWidth(byCategory[key], totals.assetsTwd),
    }));
    const debtMix = loans.map(line => ({
      id: line.id,
      label: line.name,
      twd: line.twd,
      pctLabel: pctLabel(line.twd, totals.debtPrincipalTwd),
      width: pctWidth(line.twd, totals.debtPrincipalTwd),
    }));

    function itemRow(label, twd, sub) {
      return { label: label, twd: twd, sub: sub || '', kind: 'item' };
    }
    function totalRow(label, twd) {
      return { label: label, twd: twd, sub: '', kind: 'total' };
    }

    const explain = [
      {
        id: 'assets',
        title: '總資產',
        note: '四類都先換成新臺幣，再相加。',
        rows: assetOrder.map(key => itemRow(CATEGORY_LABEL[key], byCategory[key])).concat([
          totalRow('總資產', totals.assetsTwd),
        ]),
      },
      {
        id: 'net',
        title: '未償本金與淨值',
        note: '淨值＝總資產 − 未償債務本金。到期尾款不加進本金。',
        rows: loans.map(line => itemRow(line.name + '剩餘本金', line.twd, line.fxText)).concat([
          totalRow('未償債務本金', totals.debtPrincipalTwd),
          totalRow('淨值', totals.netWorthTwd),
        ]),
      },
      {
        id: 'liquid',
        title: '流動可用現金',
        note: '只有活期存款。定存、投資、保單、不動產都不算。',
        rows: lines.filter(line => line.liquid).map(line => itemRow(line.name, line.twd, line.fxText)).concat([
          totalRow('流動可用現金', totals.liquidCashTwd),
        ]),
      },
      {
        id: 'debt-pay',
        title: '每月債務還款',
        note: '各筆月付換成新臺幣後相加。不與保費合併。',
        rows: loans.map(line => itemRow(line.name, line.monthlyTwd, line.monthlyFx)).concat([
          totalRow('每月債務還款', totals.monthlyDebtTwd),
        ]),
      },
      {
        id: 'premium',
        title: '每月保險保費',
        note: '與債務還款分開，也不從淨值扣除。',
        rows: lines.filter(line => line.category === 'policy').map(line => itemRow(line.name, line.monthlyTwd, line.monthlyFx)).concat([
          totalRow('每月保險保費', totals.monthlyPremiumTwd),
        ]),
      },
    ];

    const fxRows = Object.keys(fx).map(code => ({
      currency: code,
      name: fx[code].name,
      display: formatFx(fx[code]),
      asOf: demo.fxAsOf,
    }));

    const snapshot = {
      id: demo.id,
      label: demo.label,
      asOf: demo.asOf,
      fxAsOf: demo.fxAsOf,
      checksum: 'A' + totals.assetsTwd + '-D' + totals.debtPrincipalTwd + '-N' + totals.netWorthTwd + '-L' + totals.liquidCashTwd + '-R' + totals.monthlyDebtTwd + '-P' + totals.monthlyPremiumTwd,
      lines: lines,
      totals: totals,
      excluded: excluded,
      native: native,
      allocation: allocation,
      debtMix: debtMix,
      explain: explain,
      fxRows: fxRows,
    };
    audit(snapshot);
    return snapshot;
  }

  function audit(snapshot) {
    const lines = snapshot.lines;
    const totals = snapshot.totals;
    if (sumTwd(lines.filter(line => line.side === 'asset')) !== totals.assetsTwd) throw new Error('總資產與明細不符');
    if (sumTwd(lines.filter(line => line.side === 'liability')) !== totals.debtPrincipalTwd) throw new Error('債務本金與明細不符');
    if (totals.assetsTwd - totals.debtPrincipalTwd !== totals.netWorthTwd) throw new Error('淨值不等於資產減本金');
    if (sumTwd(lines.filter(line => line.liquid)) !== totals.liquidCashTwd) throw new Error('流動現金與明細不符');
    if (lines.some(line => line.liquid && line.category !== 'bank')) throw new Error('非存款被計入流動現金');
    if (lines.some(line => line.depositKind === 'fixed' && line.liquid)) throw new Error('定存被計入流動現金');
    const loans = lines.filter(line => line.category === 'loan');
    if (loans.reduce((acc, line) => acc + line.monthlyTwd, 0) !== totals.monthlyDebtTwd) throw new Error('每月還款不符');
    if (lines.filter(line => line.category === 'policy').reduce((acc, line) => acc + line.monthlyTwd, 0) !== totals.monthlyPremiumTwd) {
      throw new Error('每月保費不符');
    }
    const balloon = loans.reduce((acc, line) => acc + line.balloonTwd, 0);
    if (balloon !== snapshot.excluded.balloonTwd) throw new Error('尾款合計不符');
    loans.forEach(line => {
      if (line.balloonTwd > line.twd) throw new Error('尾款大於該筆本金');
    });
    if (balloon !== 0 && totals.debtPrincipalTwd !== sumTwd(loans)) throw new Error('債務本金必須只加總剩餘本金');
    Object.keys(totals.byCategory).forEach(key => {
      if (sumTwd(lines.filter(line => line.category === key)) !== totals.byCategory[key]) throw new Error(key + ' 小計不符');
    });
    const alloc = snapshot.allocation.reduce((acc, row) => acc + row.twd, 0);
    if (alloc !== totals.assetsTwd) throw new Error('配置合計不符');
    const tenths = label => {
      const matched = /^(\d+)\.(\d)%$/.exec(label);
      if (!matched) throw new Error('比例格式錯誤');
      return Number(matched[1]) * 10 + Number(matched[2]);
    };
    const rounded = snapshot.allocation.reduce((acc, row) => acc + tenths(row.pctLabel), 0);
    if (rounded !== 1000) throw new Error('資產比例四捨五入後不是 100.0%');
    const debtRounded = snapshot.debtMix.reduce((acc, row) => acc + tenths(row.pctLabel), 0);
    if (debtRounded !== 1000) throw new Error('負債比例四捨五入後不是 100.0%');
    return snapshot;
  }

  function filterLines(lines, filter) {
    if (!FILTERS.some(item => item.id === filter)) throw new Error('未知篩選');
    if (filter === 'all') return lines.slice();
    return lines.filter(line => line.category === filter);
  }

  function sortLines(lines, sort) {
    if (!SORTS.some(item => item.id === sort)) throw new Error('未知排序');
    const out = lines.slice();
    const cmp = {
      report: (a, b) => a.order - b.order,
      'amount-desc': (a, b) => b.twd - a.twd || a.order - b.order,
      'amount-asc': (a, b) => a.twd - b.twd || a.order - b.order,
      name: (a, b) => a.name.localeCompare(b.name, 'zh-Hant') || a.order - b.order,
      date: (a, b) => b.asOf.localeCompare(a.asOf) || a.order - b.order,
    }[sort];
    out.sort(cmp);
    return out;
  }

  function viewLines(lines, filter, sort) {
    const filtered = filterLines(lines, filter);
    return {
      assets: sortLines(filtered.filter(line => line.side === 'asset'), sort),
      liabilities: sortLines(filtered.filter(line => line.side === 'liability'), sort),
    };
  }

  const api = {
    DEMO: DEMO,
    FILTERS: FILTERS,
    SORTS: SORTS,
    CATEGORY_LABEL: CATEGORY_LABEL,
    formatTwd: formatTwd,
    formatMinor: formatMinor,
    formatMoney: formatMoney,
    formatFx: formatFx,
    formatRate: formatRate,
    toTwd: toTwd,
    computeFinance: computeFinance,
    audit: audit,
    filterLines: filterLines,
    sortLines: sortLines,
    viewLines: viewLines,
    sumTwd: sumTwd,
    pctWidth: pctWidth,
  };

  root.FinanceDemo = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* 財務總覽畫面。只渲染 js/finance_demo.js 的虛構試算，沒有輸入、上傳或外送。 */
(function (root) {
  'use strict';

  const FD = (typeof module !== 'undefined' && module.exports)
    ? require('./finance_demo.js')
    : root.FinanceDemo;

  function esc(value) {
    return String(value).replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[ch]));
  }

  function safeWidth(width) {
    if (!/^\d+\.\d{4}%$/.test(width)) throw new Error('寬度格式錯誤');
    return width;
  }

  function money(state, n) {
    return state.mask ? '••••' : esc(FD.formatTwd(n));
  }

  function shown(state, text) {
    return state.mask ? '••••' : esc(text);
  }

  function renderBanner() {
    return '<p class="fin-sticky fin-kicker" role="note">示範資料，非本人財務</p>'
      + '<div class="fin-banner">'
      + '<p>這是公開網頁上的示範畫面，不是私人財務紀錄。數字全部虛構。請勿輸入、貼上或上傳真實財務資訊。</p>'
      + '</div>';
  }

  function renderMeta(snapshot, state) {
    return '<div class="fin-meta">'
      + '<span>基準日 <b>' + esc(snapshot.asOf) + '</b></span>'
      + '<span>匯率日 <b>' + esc(snapshot.fxAsOf) + '</b></span>'
      + '<span>核對碼 <b data-fin-checksum>' + (state.mask ? '已隱藏' : esc(snapshot.checksum)) + '</b></span>'
      + '</div>';
  }

  function kpi(key, label, value, sub, extraClass) {
    return '<article class="fin-kpi ' + (extraClass || '') + '" data-fin-kpi="' + key + '">'
      + '<p class="fin-kpi-label">' + esc(label) + '</p>'
      + '<p class="fin-kpi-value" data-fin-value="' + key + '">' + value + '</p>'
      + '<p class="fin-kpi-sub">' + esc(sub) + '</p>'
      + '</article>';
  }

  function renderKpis(snapshot, state) {
    const t = snapshot.totals;
    return '<section class="fin-kpis" aria-label="合計">'
      + kpi('assets', '總資產', money(state, t.assetsTwd) + '<span> TWD</span>', '存款、投資市值、保單現值、不動產估價')
      + kpi('debt', '未償債務本金', money(state, t.debtPrincipalTwd) + '<span> TWD</span>', '只加剩餘本金，尾款不另計', 'fin-kpi-debt')
      + kpi('net', '淨值', money(state, t.netWorthTwd) + '<span> TWD</span>', '總資產減未償本金', 'fin-kpi-net')
      + kpi('liquid', '流動可用現金', money(state, t.liquidCashTwd) + '<span> TWD</span>', '只有活期存款')
      + '</section>';
  }

  function renderMonthly(snapshot, state) {
    const t = snapshot.totals;
    const max = Math.max(t.monthlyDebtTwd, t.monthlyPremiumTwd, 1);
    const bar = (n) => state.mask ? '' : '<span class="fin-track"><span style="width:' + safeWidth(FD.pctWidth(n, max)) + '"></span></span>';
    return '<section class="fin-flows" aria-label="每月支出">'
      + '<div><div class="fin-flow-head"><span>每月債務還款</span><b data-fin-value="monthly-debt">' + money(state, t.monthlyDebtTwd) + ' TWD</b></div>' + bar(t.monthlyDebtTwd) + '</div>'
      + '<div><div class="fin-flow-head"><span>每月保險保費</span><b data-fin-value="monthly-premium">' + money(state, t.monthlyPremiumTwd) + ' TWD</b></div>' + bar(t.monthlyPremiumTwd) + '</div>'
      + '<p class="fin-hint">這兩項分開列出，沒有加在一起，也不從淨值扣除。</p>'
      + '</section>';
  }

  function renderBars(title, rows, state, hint) {
    if (state.mask) {
      return '<section class="fin-card"><h2>' + esc(title) + '</h2><p class="fin-hint">金額隱藏時不畫比例，避免用長短看出數字。這不是安全機制。</p></section>';
    }
    const segs = rows.map(row => '<span class="fin-seg fin-seg-' + esc(row.category || 'debt') + '" style="width:' + safeWidth(row.width) + '" title="' + esc(row.label) + '"></span>').join('');
    const legend = rows.map(row => '<li><i class="fin-dot fin-seg-' + esc(row.category || 'debt') + '"></i><span>' + esc(row.label) + '</span><b>' + esc(FD.formatTwd(row.twd)) + '</b><em>' + esc(row.pctLabel) + '</em></li>').join('');
    return '<section class="fin-card"><h2>' + esc(title) + '</h2><div class="fin-bar" role="img" aria-label="' + esc(title) + '">' + segs + '</div><ul class="fin-legend">' + legend + '</ul><p class="fin-hint">' + esc(hint) + '</p></section>';
  }

  function renderToolbar(state) {
    const chips = FD.FILTERS.map(item => '<button type="button" class="fin-chip" data-fin-filter="' + item.id + '" aria-pressed="' + (state.filter === item.id ? 'true' : 'false') + '">' + esc(item.label) + '</button>').join('');
    const options = FD.SORTS.map(item => '<option value="' + item.id + '"' + (state.sort === item.id ? ' selected' : '') + '>' + esc(item.label) + '</option>').join('');
    return '<div class="fin-tools">'
      + '<div class="fin-chips" role="group" aria-label="篩選明細">' + chips + '</div>'
      + '<label class="fin-sort-label">排序<select data-fin-sort aria-label="排序明細">' + options + '</select></label>'
      + '<button type="button" class="fin-mask-btn" data-fin-mask aria-pressed="' + (state.mask ? 'true' : 'false') + '">' + (state.mask ? '顯示金額' : '隱藏金額') + '</button>'
      + '<p class="fin-hint">篩選與排序只影響明細，上方合計維持全貌。隱藏金額只改畫面，原始碼仍是同一份虛構數字，也不是存取控制。</p>'
      + '</div>';
  }

  function renderLine(line, state) {
    const open = state.open.has(line.id);
    const details = open ? '<div class="fin-detail" id="fin-detail-' + esc(line.id) + '"><dl>'
      + line.details.map(row => '<div class="' + (row.kind === 'note' ? 'fin-note' : '') + '"><dt>' + esc(row.k) + '</dt><dd class="fin-' + esc(row.kind) + '">' + (row.kind === 'out' ? '<span class="fin-badge">不計入</span>' : '') + shown(state, row.v) + '</dd></div>').join('')
      + '</dl></div>' : '';
    return '<article class="fin-item" data-cat="' + esc(line.category) + '">'
      + '<button type="button" class="fin-row" data-fin-toggle="' + esc(line.id) + '" aria-expanded="' + (open ? 'true' : 'false') + '">'
      + '<span class="fin-cat">' + esc(FD.CATEGORY_LABEL[line.category]) + '</span>'
      + '<span class="fin-name">' + esc(line.name) + '</span>'
      + '<span class="fin-line-amt">' + money(state, line.twd) + ' TWD</span>'
      + '<span class="fin-line-meta">' + shown(state, line.meta) + '</span>'
      + '<span class="fin-more">' + (open ? '收合' : '明細') + '</span>'
      + '</button>' + details + '</article>';
  }

  function renderSection(side, title, lines, state) {
    const filterSide = state.filter === 'all' ? 'both' : (state.filter === 'loan' ? 'liability' : 'asset');
    if (!lines.length && filterSide !== 'both' && filterSide !== side) return '';
    const body = lines.length
      ? lines.map(line => renderLine(line, state)).join('')
        + '<p class="fin-subtotal">目前列出的新臺幣小計 <b>' + money(state, FD.sumTwd(lines)) + '</b></p>'
      : '<p class="fin-empty">這個分類沒有示範項目。</p>';
    return '<section class="fin-card" data-fin-section="' + side + '"><h2>' + esc(title) + ' <span class="fin-count">' + lines.length + '</span></h2>' + body + '</section>';
  }

  function renderFx(snapshot) {
    const rows = snapshot.fxRows.map(row => '<tr><td data-label="幣別">' + esc(row.currency) + '</td><td data-label="名稱">' + esc(row.name) + '</td><td class="fin-num" data-label="1 單位換新臺幣">' + esc(row.display) + '</td><td data-label="基準日">' + esc(row.asOf) + '</td></tr>').join('');
    return '<section class="fin-card"><h2>示範匯率</h2><div class="fin-scroll"><table class="fin-table"><thead><tr><th>幣別</th><th>名稱</th><th>1 單位換新臺幣</th><th>基準日</th></tr></thead><tbody>' + rows + '</tbody></table></div><p class="fin-hint">匯率是寫死的示範值，基準日 ' + esc(snapshot.fxAsOf) + '，不是市場報價。只有換算後的新臺幣會進入合計。</p></section>';
  }

  function renderNative(snapshot, state) {
    const groups = [
      ['bank', '銀行存款'],
      ['investment', '投資'],
      ['policy', '保單計入值'],
      ['property', '不動產'],
      ['loan', '貸款本金'],
    ];
    const body = groups.map(([key, label]) => {
      const rows = snapshot.native[key].map(row => '<li><span>' + esc(FD.DEMO.fx[row.currency].name) + '</span><b>' + shown(state, FD.formatMinor(row.minor, row.scale) + ' ' + row.currency) + '</b></li>').join('');
      return '<div><h3>' + esc(label) + '</h3><ul>' + rows + '</ul></div>';
    }).join('');
    return '<section class="fin-card"><h2>原幣餘額</h2><div class="fin-native">' + body + '</div><p class="fin-hint">同一組裡的不同幣別分開列，沒有把美元、日圓和新臺幣的原幣數字加在一起。</p></section>';
  }

  function renderExcluded(snapshot, state) {
    const rows = snapshot.excluded.items.map(item => '<tr><td data-label="項目">' + esc(item.label) + '</td><td class="fin-num" data-label="新臺幣">' + money(state, item.twd) + '</td><td data-label="原因">' + esc(item.reason) + '</td></tr>').join('');
    return '<section class="fin-card"><h2>不計入合計的數字</h2><div class="fin-scroll"><table class="fin-table"><thead><tr><th>項目</th><th>新臺幣</th><th>原因</th></tr></thead><tbody>' + rows + '</tbody></table></div><p class="fin-hint">傳統保單用解約金；投資型保單用帳戶價值。身故保額、累計已繳保費，以及另一種現值，都不算資產。到期尾款已在剩餘本金裡。</p></section>';
  }

  function renderMath(snapshot, state) {
    const groups = snapshot.explain.map(group => {
      const rows = group.rows.map(row => '<div class="fin-math-row' + (row.kind === 'total' ? ' is-total' : '') + '"><span>' + esc(row.label) + (row.sub && !state.mask ? '<small>' + esc(row.sub) + '</small>' : '') + '</span><b>' + money(state, row.twd) + '</b></div>').join('');
      return '<div class="fin-math"><h3>' + esc(group.title) + '</h3><p class="fin-hint">' + esc(group.note) + '</p>' + rows + '</div>';
    }).join('');
    return '<section class="fin-card" data-fin-section="math"><h2>合計怎麼來的</h2>' + groups + '</section>';
  }

  function renderRules() {
    return '<section class="fin-card"><h2>計算口徑</h2><ol class="fin-rules">'
      + '<li>總資產＝銀行存款＋投資目前市值＋保單現值＋不動產估價。先換算成新臺幣再相加。</li>'
      + '<li>保單只計一種現值：傳統保單用解約金，投資型保單用帳戶價值。</li>'
      + '<li>未償債務本金＝各筆剩餘本金換算後相加。到期尾款不另加。</li>'
      + '<li>淨值＝總資產 − 未償債務本金。</li>'
      + '<li>流動可用現金＝活期存款。定存仍算資產，但不算流動現金。</li>'
      + '<li>每月債務還款與每月保險保費分開，不混成一個支出合計。</li>'
      + '</ol></section>';
  }

  function renderFuture() {
    return '<section class="fin-card fin-future"><h2>私人資料層</h2>'
      + '<p>未來若要改成本人的財務紀錄，必須另外做一層受保護的私人資料，和這個公開頁面分開，並有存取控制。那一層目前不存在。</p>'
      + '<p>這一版沒有登入、沒有資料輸入或上傳、沒有把數字存在這台裝置上，也不會把數字傳出這台裝置。</p>'
      + '<p class="fin-kicker">示範資料，非本人財務</p>'
      + '</section>';
  }

  function renderFinanceHtml(snapshot, state) {
    const viewState = {
      filter: state && state.filter ? state.filter : 'all',
      sort: state && state.sort ? state.sort : 'report',
      mask: !!(state && state.mask),
      open: state && state.open ? state.open : new Set(),
    };
    const view = FD.viewLines(snapshot.lines, viewState.filter, viewState.sort);
    const debtRows = snapshot.debtMix.map(row => ({
      category: row.id,
      label: row.label,
      twd: row.twd,
      pctLabel: row.pctLabel,
      width: row.width,
    }));
    return '<div class="fin-root' + (viewState.mask ? ' is-masked' : '') + '">'
      + renderBanner()
      + renderMeta(snapshot, viewState)
      + renderKpis(snapshot, viewState)
      + renderMonthly(snapshot, viewState)
      + renderBars('資產配置', snapshot.allocation, viewState, '比例以新臺幣總資產為分母。色條用精確比例，旁邊的百分比四捨五入到一位小數。')
      + renderBars('債務本金構成', debtRows, viewState, '各筆剩餘本金占未償本金的比例。尾款沒有再畫一條。')
      + renderToolbar(viewState)
      + renderSection('asset', '資產明細', view.assets, viewState)
      + renderSection('liability', '負債明細', view.liabilities, viewState)
      + renderFx(snapshot)
      + renderNative(snapshot, viewState)
      + renderExcluded(snapshot, viewState)
      + renderMath(snapshot, viewState)
      + renderRules()
      + renderFuture()
      + '</div>';
  }

  function mount(root) {
    if (typeof document === 'undefined') return null;
    const el = root || document.getElementById('tab-finance');
    if (!el || !FD) return null;
    let snapshot;
    try {
      snapshot = FD.computeFinance(FD.DEMO);
    } catch (err) {
      el.innerHTML = '<p class="fin-fallback">示範試算沒有通過內部核對，已停止顯示，避免放出對不上的合計。這仍然不是本人財務。</p>';
      return el;
    }
    const state = { filter: 'all', sort: 'report', mask: false, open: new Set() };
    const draw = () => { el.innerHTML = renderFinanceHtml(snapshot, state); };
    el.addEventListener('click', event => {
      const filterBtn = event.target.closest('[data-fin-filter]');
      if (filterBtn) {
        state.filter = filterBtn.getAttribute('data-fin-filter');
        draw();
        return;
      }
      const toggle = event.target.closest('[data-fin-toggle]');
      if (toggle) {
        const id = toggle.getAttribute('data-fin-toggle');
        if (state.open.has(id)) state.open.delete(id);
        else state.open.add(id);
        draw();
        return;
      }
      if (event.target.closest('[data-fin-mask]')) {
        state.mask = !state.mask;
        draw();
      }
    });
    el.addEventListener('change', event => {
      const sort = event.target.closest('[data-fin-sort]');
      if (!sort) return;
      state.sort = sort.value;
      draw();
    });
    draw();
    return el;
  }

  const api = { renderFinanceHtml: renderFinanceHtml, mount: mount };
  root.FinanceOverview = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  if (typeof document !== 'undefined') mount();
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
</body>
</html>
